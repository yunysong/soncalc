
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>옥수수 보험금 계산 연습</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f8f2;
      margin: 0;
      padding: 20px;
      color: #26352a;
    }
    main {
      max-width: 620px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }
    h1 { color: #34763b; font-size: 25px; }
    h2 { font-size: 19px; margin-top: 30px; }
    label { display: block; margin-top: 12px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #34763b;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 16px;
    }
    .result {
      background: #eef6eb;
      padding: 16px;
      margin-top: 20px;
      border-radius: 10px;
      line-height: 1.9;
    }
    .note { color: #666; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>🌽 옥수수 보험금 계산 연습</h1>
  <p>손해평가 코딩쟁이 | 단계별 계산 학습</p>
  <p class="note">
    이 프로그램은 계산 원리를 익히기 위한
    예시입니다. 실제 보험금 산정에는 해당
    보험상품의 약관과 손해평가 기준을 적용해야 합니다.
  </p>

  <h2>기초 자료 입력</h2>

  <label>기준 수확량 (kg)
    <input id="standard" type="number" min="0" value="1000">
  </label>

  <label>실제 수확량 (kg)
    <input id="actual" type="number" min="0" value="600">
  </label>

  <label>단위가격 (원/kg)
    <input id="price" type="number" min="0" value="2000">
  </label>

  <label>자기부담 비율 (%)
    <input id="deduct" type="number" min="0" max="100" value="20">
  </label>

  <label>보험금 지급한도 (원)
    <input id="limit" type="number" min="0" value="1000000">
  </label>

  <button onclick="calculate()">4단계 계산하기</button>

  <div id="result" class="result" aria-live="polite">
    값을 입력하고 계산 버튼을 눌러주세요.
  </div>
</main>

<script>
function calculate() {
  const ids = ["standard", "actual", "price", "deduct", "limit"];
  const values = ids.map(id =>
    Number(document.getElementById(id).value)
  );

  if (ids.some(id => document.getElementById(id).value.trim() === "") ||
      values.some(v => !Number.isFinite(v) || v < 0) ||
      values[3] > 100) {
    document.getElementById("result").textContent =
      "입력값을 확인해주세요. 음수는 사용할 수 없고 자기부담 비율은 0~100%입니다.";
    return;
  }

  const [standard, actual, price, deduct, limit] = values;

  // 학습용 예시 계산식
  const damaged = Math.max(0, standard - actual);
  const loss = damaged * price;
  const own = loss * deduct / 100;
  const afterDeduct = Math.max(0, loss - own);
  const payment = Math.min(afterDeduct, limit);

  const won = n => n.toLocaleString("ko-KR", {
    maximumFractionDigits: 2
  });

  document.getElementById("result").innerHTML = `
    <strong>1단계 · 손해액</strong><br>
    피해수확량: ${won(damaged)} kg<br>
    손해액: ${won(loss)} 원<br><br>

    <strong>2단계 · 자기부담금</strong><br>
    자기부담금: ${won(own)} 원<br>
    공제 후 금액: ${won(afterDeduct)} 원<br><br>

    <strong>3단계 · 지급한도 적용</strong><br>
    지급한도: ${won(limit)} 원<br><br>

    <strong>4단계 · 최종 보험금</strong><br>
    <strong style="font-size:22px;color:#34763b">
      ${won(payment)} 원
    </strong>
  `;
}
</script>
</body>
</html>
