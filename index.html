<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>손해평가사 계산 학습실</title><style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#183127;background:#f1f5f1}body{max-width:850px;margin:24px auto;padding:14px}main{background:white;padding:clamp(18px,4vw,38px);border-radius:18px;box-shadow:0 4px 22px #0001}h1{margin-top:0}button,select,input{font:inherit;padding:11px;border-radius:9px;border:1px solid #bacac0}button{background:#176343;color:white;border:0;cursor:pointer;margin:5px}button:disabled{opacity:.4}input{width:95%;box-sizing:border-box}label{display:block;margin:12px 0 5px;font-weight:600}.panel{background:#edf5ef;padding:16px;border-radius:12px;line-height:1.8}.warn{background:#fff3d9;padding:13px;border-radius:10px}.muted{color:#586d61}#feedback{min-height:38px;font-weight:600}.tabs button{background:#dbe9df;color:#17462e}.tabs button.active{background:#176343;color:white}#formula{white-space:pre-line}.hide{display:none}small{line-height:1.6}</style></head><body><main>
<h1>🌱 손해평가사 계산 학습실</h1><p class="muted">사과 · 옥수수 | 단계별 계산 · 자동 채점 · 계산기</p>
<p class="warn"><strong>학습용 예제입니다.</strong> 아래 수치는 기출문제 원문이 아닌 연습용 수치입니다. 실제 보험금 지급 판단에는 가입 상품·보장 유형·약관·해당 연도 손해평가요령을 확인해야 합니다.</p>
<label for="crop">작물과 보장 유형</label><select id="crop"><option value="apple">🍎 사과 — 종합위험 수확감소보장 예제</option><option value="corn">🌽 옥수수 — 종합위험 수확감소보장 예제</option></select>
<div class="tabs"><button id="practice" class="active">문제 풀기</button><button id="calc">계산기</button></div>
<div id="intro" class="panel"></div><section id="quiz"><h2 id="step"></h2><p id="question"></p><label for="answer">계산 결과 입력 (숫자만)</label><input id="answer" type="number" step="any" inputmode="decimal"><div><button id="check">채점하기</button><button id="hint">힌트</button><button id="next" disabled>다음 단계</button><button id="reset">다시 풀기</button></div><p id="feedback" aria-live="polite"></p><p id="progress" class="muted"></p></section>
<section id="calculator" class="hide"><h2>수치 변경 계산기</h2><div id="fields"></div><button id="compute">계산하기</button><div id="result" class="panel" aria-live="polite"></div></section>
<hr><small class="muted">출처: 사용자가 제공한 『2026 이론서』의 작물별 산식 중 일부를 교육용으로 재구성. 옥수수의 표본조사·피해수확량 산정, 사과의 적과전종합위험방식 및 특약은 이 시제품 범위에서 제외했습니다. 실제 기출문제와 정답을 대조한 버전은 아닙니다.</small>
</main><script>
const $=x=>document.getElementById(x),fmt=x=>Number(x).toLocaleString('ko-KR',{maximumFractionDigits:4});
const configs={
apple:{name:'사과',desc:'종합위험 수확감소보장(연습용): 피해율 = (평년수확량 − 수확량 − 미보상감수량 + 병충해감수량) ÷ 평년수확량. 보험금 = 보험가입금액 × max(0, 피해율 − 자기부담비율).',fields:[['normal','평년수확량 (kg)',10000],['harvest','수확량 (kg)',6500],['uncovered','미보상감수량 (kg)',300],['pest','병충해감수량 (kg)',200],['insured','보험가입금액 (원)',10000000],['deduct','자기부담비율 (%)',20]],solve:v=>{let loss=v.normal-v.harvest-v.uncovered+v.pest,rate=loss/v.normal,pay=v.insured*Math.max(0,rate-v.deduct/100);return [{q:'보상 대상 감수량은 몇 kg인가요?',a:loss,ex:`${fmt(v.normal)} − ${fmt(v.harvest)} − ${fmt(v.uncovered)} + ${fmt(v.pest)} = ${fmt(loss)} kg`,hint:'평년수확량 − 수확량 − 미보상감수량 + 병충해감수량'},{q:'피해율은 몇 %인가요? (백분율 숫자 입력)',a:rate*100,ex:`${fmt(loss)} ÷ ${fmt(v.normal)} × 100 = ${fmt(rate*100)}%`,hint:'감수량 ÷ 평년수확량 × 100'},{q:'자기부담비율 차감 후 보상 대상 비율은 몇 %인가요?',a:Math.max(0,rate*100-v.deduct),ex:`max(0, ${fmt(rate*100)} − ${fmt(v.deduct)}) = ${fmt(Math.max(0,rate*100-v.deduct))}%`,hint:'피해율에서 자기부담비율 차감, 음수면 0'},{q:'최종 보험금은 몇 원인가요?',a:pay,ex:`${fmt(v.insured)} × ${fmt(Math.max(0,rate-v.deduct/100))} = ${fmt(pay)}원`,hint:'보험가입금액 × 보상 대상 비율'}]}},
corn:{name:'옥수수',desc:'종합위험 수확감소보장(연습용): 손해액 = 피해수확량 × 가입가격. 자기부담금 = 보험가입금액 × 자기부담비율. 보험금 = max(0, min(보험가입금액, 손해액) − 자기부담금).',fields:[['damaged','피해수확량 (kg, 미보상감수량 제외)',600],['price','가입가격 (원/kg)',2000],['insured','보험가입금액 (원)',2000000],['deduct','자기부담비율 (%)',20]],solve:v=>{let loss=v.damaged*v.price,own=v.insured*v.deduct/100,cap=Math.min(v.insured,loss),pay=Math.max(0,cap-own);return [{q:'손해액은 몇 원인가요?',a:loss,ex:`${fmt(v.damaged)} × ${fmt(v.price)} = ${fmt(loss)}원`,hint:'피해수확량 × 가입가격'},{q:'자기부담금은 몇 원인가요?',a:own,ex:`${fmt(v.insured)} × ${fmt(v.deduct/100)} = ${fmt(own)}원`,hint:'보험가입금액 × 자기부담비율'},{q:'보험가입금액 한도를 적용한 손해액은 몇 원인가요?',a:cap,ex:`min(${fmt(v.insured)}, ${fmt(loss)}) = ${fmt(cap)}원`,hint:'보험가입금액과 손해액 중 작은 값'},{q:'최종 보험금은 몇 원인가요?',a:pay,ex:`max(0, ${fmt(cap)} − ${fmt(own)}) = ${fmt(pay)}원`,hint:'한도 적용 손해액 − 자기부담금, 음수면 0'}]}}};
let crop='apple',mode='practice',i=0,wrong=0,steps=[],values={};
function defaults(){values=Object.fromEntries(configs[crop].fields.map(f=>[f[0],f[2]]));}
function build(){steps=configs[crop].solve(values);i=0;wrong=0;$('intro').textContent=configs[crop].desc;$('fields').innerHTML=configs[crop].fields.map(([key,label])=>`<label for="f_${key}">${label}</label><input type="number" id="f_${key}" step="any" min="0" value="${values[key]}">`).join('');$('result').textContent='값을 변경하고 계산하기를 누르세요.';render();}
function render(){if(i>=steps.length){$('step').textContent='🎉 학습 완료';$('question').textContent=`${crop==='apple'?'사과':'옥수수'} 최종 보험금: ${fmt(steps.at(-1).a)}원 / 오답 시도 ${wrong}회`;$('answer').classList.add('hide');$('check').disabled=true;$('hint').disabled=true;$('next').disabled=true;$('feedback').textContent='다시 풀기로 반복 학습할 수 있습니다.';return;}$('answer').classList.remove('hide');$('step').textContent=`${i+1} / ${steps.length} 단계`;$('question').textContent=steps[i].q;$('answer').value='';$('check').disabled=false;$('hint').disabled=false;$('next').disabled=true;$('feedback').textContent='';$('progress').textContent=`오답 시도: ${wrong}회`;}
$('crop').onchange=e=>{crop=e.target.value;defaults();build();};$('practice').onclick=()=>switchMode('practice');$('calc').onclick=()=>switchMode('calc');
function switchMode(m){mode=m;$('quiz').classList.toggle('hide',m!=='practice');$('calculator').classList.toggle('hide',m!=='calc');$('practice').classList.toggle('active',m==='practice');$('calc').classList.toggle('active',m==='calc');}
$('check').onclick=()=>{const raw=$('answer').value;if(raw.trim()===''){$('feedback').textContent='답을 입력해 주세요.';return;}const actual=Number(raw),s=steps[i],ok=Math.abs(actual-s.a)<=Math.max(0.000001,Math.abs(s.a)*0.0000001);if(ok){$('feedback').textContent='✅ 정답! '+s.ex;$('check').disabled=true;$('next').disabled=false;}else{wrong++;$('feedback').textContent='❌ 다시 계산해 보세요. 힌트 버튼을 눌러보세요.';$('progress').textContent=`오답 시도: ${wrong}회`;}};$('hint').onclick=()=>{$('feedback').textContent='💡 '+steps[i].hint;};$('next').onclick=()=>{i++;render();};$('reset').onclick=()=>{i=0;wrong=0;render();};
$('compute').onclick=()=>{const v={};for(const [key,label] of configs[crop].fields){let n=Number($('f_'+key).value);if($('f_'+key).value.trim()===''||!Number.isFinite(n)||n<0){$('result').textContent=label+'에 유효한 0 이상의 수를 입력하세요.';return;}v[key]=n;}if(v.deduct>100|| (crop==='apple'&&v.normal<=0)){$('result').textContent='자기부담비율은 0~100%, 평년수확량은 0 초과여야 합니다.';return;}values=v;steps=configs[crop].solve(values);$('result').innerHTML=steps.map((s,j)=>`<p><strong>${j+1}단계</strong> ${s.ex}</p>`).join('')+'<p><strong>이 값으로 연습하려면 ‘문제 풀기’를 누르세요.</strong></p>';i=0;wrong=0;render();};defaults();build();
</script></body></html>
